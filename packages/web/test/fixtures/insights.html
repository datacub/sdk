<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>insights</title>
  <script>
    // Stands in for the core's side of the handshake: window.__datacub with e(), and inject()
    // loads the module from {apiHost}/v1/sdk/ as the core does. Every e() call is recorded in E.
    window.E = []
    window.inject = function (src) {
      window.__datacub = {
        e: function (n, p) { E.push([n, JSON.parse(JSON.stringify(p))]) },
        // the core's form description: name, templated action path, field count
        f: function (f) {
          var u = new URL(f.getAttribute('action') || '', location.href)
          return { $f: f.getAttribute('data-datacub-name'), $a: u.origin + u.pathname, $i: f.elements.length }
        },
        v: 'test',
      }
      var s = document.createElement('script')
      s.src = src
      document.head.appendChild(s)
      return new Promise(function (r) { s.onload = r })
    }
    // A layout shift with no input before it, after load and before the module arrives (600 ms, as
    // mobile Chromium flags shifts in the first 500 ms as hadRecentInput).
    addEventListener('load', function () {
      setTimeout(function () {
        var d = document.createElement('div')
        d.style.height = '200px'
        d.textContent = 'banner'
        document.body.insertBefore(d, document.body.firstChild)
      }, 600)
    })
  </script>
</head>
<body>
  <h1 style="font-size:64px;margin:0">مرحبا بكم في المتجر الكبير</h1>
  <p>Largest paint candidate text with enough words to be painted early.</p>
  <button id="busy" type="button" onclick="var t=performance.now();while(performance.now()-t<120){}">busy</button>
  <form id="signup" data-datacub-name="signup" action="/account/create?ref=abc">
    <input name="full_name" autocomplete="name">
    <input name="email" type="email" autocomplete="shipping email" required>
    <input name="password" type="password" autocomplete="new-password">
    <input name="otp_box" autocomplete="one-time-code">
    <input name="nid_1234567890">
    <input type="hidden" name="csrf" value="tok">
    <select name="plan"><option>pro</option><option>basic</option></select>
    <textarea id="notes"></textarea>
    <button type="submit">go</button>
  </form>
  <form id="search"><input name="q"></form>
  <form id="other"><input name="city"></form>
  <script>
    document.addEventListener('submit', function (e) { e.preventDefault() })
  </script>
</body>
</html>
