<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>متجر تجريبي</title>
  <script src="/datacub.js"></script>
</head>
<body>
  <nav>
    <a id="home" href="/page.html">الرئيسية</a>
    <a id="tel" href="tel:+966551234567">اتصل</a>
    <a id="mail" href="mailto:someone@example.com">راسلنا</a>
    <a id="ext" href="https://partner.example/offer/1012345678?ref=abc#frag">شريك</a>
    <a id="qlink" href="/products/42?email=a%40b.co&utm_source=x">منتج</a>
  </nav>
  <button id="buy" data-datacub-name="buy_now"><span id="buy-icon">★</span> اشترِ الآن</button>
  <button id="templated" data-datacub-name="profile-someone@example.com">ملفي</button>
  <div role="button" id="rolebtn">زر</div>
  <div id="plain">نص عادي</div>
  <section class="datacub-no-capture"><button id="secret-btn">لا تلتقط</button></section>
  <section data-datacub-no-capture><a id="secret-link" href="/x">لا تلتقط</a></section>

  <form id="signup" data-datacub-name="signup" action="/signup?token=abc123">
    <input id="name" name="full_name" autocomplete="name">
    <input id="email" name="email" type="email">
    <input id="pass" name="password" type="password">
    <input id="card" name="cc" autocomplete="cc-number">
    <input id="otp" name="code" autocomplete="one-time-code">
    <input id="nid" name="national_id">
    <textarea id="msg" name="message"></textarea>
    <div id="editor" contenteditable="true"></div>
    <select id="city" name="city"><option>الرياض</option><option>جدة</option></select>
    <input id="action-shadow" name="action" value="shadow">
    <button id="submit" type="submit">سجل</button>
  </form>
  <div style="height: 4000px"></div>
  <script>
    // forms post nowhere in tests
    document.addEventListener('submit', (e) => e.preventDefault())
  </script>
</body>
</html>
