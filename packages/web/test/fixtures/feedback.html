<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>feedback</title></head>
<body>
  <button id="send" data-datacub-feedback>Send feedback</button>
  <input id="field">
  <script>
    // ?run=<id>&consent (data-require-consent) &off (data-feedback="off") &both (an older install:
    // the feedback.js tag beside the SDK) &look=<json> (init with feedback.look, no data-id)
    var q = new URLSearchParams(location.search)
    var host = location.origin + '/r/' + q.get('run')
    var s = document.createElement('script')
    s.src = '/datacub.js'
    s.dataset.apiHost = host
    if (q.has('look'))
      s.onload = function () {
        datacub.init('abcd1234', { apiHost: host, feedback: { look: JSON.parse(q.get('look')) } })
      }
    else s.dataset.id = 'abcd1234'
    if (q.has('consent')) s.dataset.requireConsent = ''
    if (q.has('off')) s.dataset.feedback = 'off'
    document.head.appendChild(s)
    if (q.has('both')) {
      var f = document.createElement('script')
      f.src = host + '/v1/feedback.js'
      f.async = true
      document.head.appendChild(f)
    }
  </script>
</body></html>
