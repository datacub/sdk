name: Bug report
description: Something in @datacub/web does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Security problems go to the Security tab, not here** (see SECURITY.md). Never paste project keys, user data or personal information into an issue.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The `@datacub/web` version you use.
      placeholder: e.g. 0.3.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, framework (React, Vue, plain HTML...), and whether you load the SDK with the script tag or from npm.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest code or steps that show the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or errors
      description: Remove anything personal before pasting.
      render: text
